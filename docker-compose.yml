# SimplePod Swarm — Docker Compose Deployment
# ===========================================
# One command to deploy the entire control plane:
#   docker-compose up -d
#
# ELI5: This is like a pre-wired portable generator.
#       You wheel it to the job site, plug in the fuel
#       (env vars), and pull the starter cord.

services:
  simplepod-swarm:
    build: .
    container_name: simplepod-swarm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your config file so you can edit it without rebuilding
      - ./config.yaml:/app/config.yaml:ro
      # Persistent backup directory
      - ./ark_backups:/app/ark_backups
      # Telemetry logs survive container restarts
      - ./telemetry_logs:/app/telemetry_logs
      # Phone simulator data for OrbitScribe demos
      - ./data/phone_simulator:/app/data/phone_simulator:ro
    environment:
      # Cloud API keys (replace in .env file)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Local Ollama connection (via docker host gateway)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Twilio credentials
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      # Tailscale mesh auth
      - TAILSCALE_AUTH_KEY=${TAILSCALE_AUTH_KEY:-}
      # Runtime paths
      - ARK_BACKUP_DIR=/app/ark_backups
      - TELEMETRY_LOG_DIR=/app/telemetry_logs
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      ollama:
        condition: service_started

  # Optional: Ollama sidecar for local LLM inference
  # Remove this if you run Ollama natively on the host.
  ollama:
    image: ollama/ollama:latest
    container_name: simplepod-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama-models:
